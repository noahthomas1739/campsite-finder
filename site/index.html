<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campsite Finder</title>
<meta name="description" content="Open campsites within about two hours of Grapevine, TX, updated every few hours.">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d2321; --muted: #5f6b66; --line: #dfe3df;
    --accent: #1f6f5c; --accent-soft: #e3f1ec; --warn: #8a5a00; --chip: #eef1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --panel: #1a201d; --text: #e7ece9; --muted: #9aa8a2; --line: #2c3531;
      --accent: #5cc2a4; --accent-soft: #1d3530; --warn: #e0b45c; --chip: #232b27;
    }
  }
  * { box-sizing: border-box; }
  input { accent-color: var(--accent); }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 12px;
              background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  select, input[type=range] { width: 100%; }
  select { padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--bg); color: var(--text); font: inherit; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 22px; color: var(--text); font-size: .95rem; }
  .summary { margin: 16px 2px 10px; color: var(--muted); }
  .summary strong { color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line);
          border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  td.num { white-space: nowrap; }
  a { color: var(--accent); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .src { font-size: .78rem; color: var(--muted); }
  .sites { display: flex; flex-wrap: wrap; gap: 5px; }
  .site { background: var(--chip); border-radius: 6px; padding: 2px 7px; font-size: .85rem; white-space: nowrap;
          color: var(--text); text-decoration: none; }
  a.site:hover { background: var(--accent-soft); }
  .book { display: inline-block; background: var(--accent); color: var(--panel); text-decoration: none;
          padding: 6px 12px; border-radius: 8px; font-weight: 600; white-space: nowrap; }
  .empty, .note { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .note { margin-top: 18px; color: var(--muted); font-size: .88rem; }
  .warn { color: var(--warn); }
  @media (max-width: 720px) {
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    table { border: 0; background: none; }
    tr { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 4px 0; }
    td { border: 0; padding: 6px 14px; }
    td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: .8rem; }
  }
</style>
</head>
<body>
<main>
  <h1>Open campsites</h1>
  <p class="sub" id="sub">Loading…</p>

  <section class="controls" aria-label="Filters">
    <div><label for="arrival">Arrive</label><select id="arrival"></select></div>
    <div><label for="nights">Nights</label>
      <select id="nights"><option value="1">1 night</option><option value="2">2 nights</option>
        <option value="3">3 nights</option></select></div>
    <div><label for="dir">Direction</label>
      <select id="dir">
        <option value="any">Any direction</option>
        <option value="east">East (NE to SE)</option>
        <option value="north">North (NW to NE)</option>
        <option value="south">South (SE to SW)</option>
        <option value="west">West (SW to NW)</option>
      </select></div>
    <div><label for="miles">Max distance: <span id="milesOut"></span></label>
      <input id="miles" type="range" min="10" max="110" step="5"></div>
    <div><label class="check"><input id="electric" type="checkbox" checked> Electric hookup only</label></div>
    <div><label for="sort">Sort</label>
      <select id="sort"><option value="miles">Closest first</option><option value="sites">Most open sites</option></select></div>
  </section>

  <p class="summary" id="summary"></p>
  <div id="results"></div>

  <p class="note" id="note">
    Distances are straight-line from the starting point. Availability changes fast, so confirm on the
    booking page. Texas State Parks also charge a daily entrance fee per person. Recreation.gov prices are
    shown on its site.
  </p>
</main>

<script>
const HEADINGS = { east: ["NE", "E", "SE"], north: ["NW", "N", "NE"], south: ["SE", "S", "SW"], west: ["SW", "W", "NW"] };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let data = null;

function parseDay(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function isoDay(dt) { return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`; }
function addDays(iso, n) { const d = parseDay(iso); d.setDate(d.getDate() + n); return isoDay(d); }
function pretty(iso) { return parseDay(iso).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }

function save() {
  try { localStorage.setItem("cf-filters", JSON.stringify({ nights: $("nights").value, dir: $("dir").value,
    miles: $("miles").value, electric: $("electric").checked, sort: $("sort").value })); } catch (e) {}
}
function restore() {
  try {
    const f = JSON.parse(localStorage.getItem("cf-filters") || "{}");
    if (f.nights) $("nights").value = f.nights;
    if (f.dir) $("dir").value = f.dir;
    if (f.miles) $("miles").value = f.miles;
    if (typeof f.electric === "boolean") $("electric").checked = f.electric;
    if (f.sort) $("sort").value = f.sort;
  } catch (e) {}
}

function setup() {
  const first = data.first_night, last = data.last_night;
  const sel = $("arrival");
  let defaultIdx = 0, i = 0;
  for (let d = first; d <= last; d = addDays(d, 1), i++) {
    const opt = document.createElement("option");
    opt.value = d; opt.textContent = pretty(d);
    sel.appendChild(opt);
    if (!defaultIdx && parseDay(d).getDay() === 5) defaultIdx = i;  // first Friday
  }
  sel.selectedIndex = defaultIdx;
  $("miles").max = data.radius_miles;
  $("miles").value = data.radius_miles;
  restore();
  if (+$("miles").value > data.radius_miles) $("miles").value = data.radius_miles;

  const updated = new Date(data.generated_at);
  const from = data.origin.name ? ` of ${esc(data.origin.name)}` : "";
  $("sub").innerHTML = `Within about ${data.radius_miles} miles${from}. Updated ${esc(updated.toLocaleString(undefined,
    { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}.`;
  if (Date.now() - updated.getTime() > 24 * 3600 * 1000)
    $("sub").innerHTML += ` <span class="warn">This data is more than a day old.</span>`;
  if (data.errors.length) {
    $("note").innerHTML += `<br><br><span class="warn">${data.errors.length} place(s) couldn't be checked on the last update:</span> ` +
      data.errors.map((e) => esc(e.split(":")[0])).join(", ") + ".";
  }
  for (const id of ["arrival", "nights", "dir", "miles", "electric", "sort"])
    $(id).addEventListener("input", () => { save(); render(); });
  render();
}

function render() {
  const arrival = $("arrival").value, nights = +$("nights").value;
  const stay = Array.from({ length: nights }, (_, k) => addDays(arrival, k));
  const lastNight = stay[stay.length - 1];
  const maxMiles = +$("miles").value, dir = $("dir").value, electric = $("electric").checked;
  $("milesOut").textContent = `${maxMiles} mi`;

  if (lastNight > data.last_night) {
    $("summary").textContent = "";
    $("results").innerHTML = `<div class="empty">That stay runs past ${esc(pretty(data.last_night))}, the last night this page has data for.</div>`;
    return;
  }

  const rows = [];
  for (const cg of data.campgrounds) {
    if (cg.miles > maxMiles) continue;
    if (dir !== "any" && !HEADINGS[dir].includes(cg.heading)) continue;
    const open = cg.sites.filter((s) => (!electric || s.electric) && stay.every((n) => s.open.includes(n)));
    if (open.length) rows.push({ cg, open });
  }
  if ($("sort").value === "sites") rows.sort((a, b) => b.open.length - a.open.length);

  const total = rows.reduce((n, r) => n + r.open.length, 0);
  $("summary").innerHTML = `<strong>${rows.length}</strong> campground${rows.length === 1 ? "" : "s"}, ` +
    `<strong>${total}</strong> site${total === 1 ? "" : "s"} open ${esc(pretty(arrival))} for ${nights} night${nights > 1 ? "s" : ""}`;

  if (!rows.length) {
    $("results").innerHTML = `<div class="empty">Nothing open for that stay. Try another night, a longer distance, or turn off “Electric hookup only”.</div>`;
    return;
  }

  const body = rows.map(({ cg, open }) => {
    const book = cg.booking_url_template
      ? cg.booking_url_template.replace("{arrival}", arrival).replace("{nights}", nights)
      : cg.url;
    const rates = [...new Set(open.map((s) => s.rate).filter(Boolean))];
    const price = rates.length ? rates.join(" / ") : "See site";
    const chips = open.map((s) => {
      const label = esc([s.loop, s.name].filter(Boolean).join(" ")) + (s.amps ? ` · ${esc(s.amps)}A` : "");
      const title = esc(s.type);
      return s.url ? `<a class="site" href="${esc(s.url)}" target="_blank" rel="noopener" title="${title}">${label}</a>`
                   : `<span class="site" title="${title}">${label}</span>`;
    }).join("");
    return `<tr>
      <td><div class="name">${esc(cg.name)}</div><div class="src">${esc(cg.source)}</div></td>
      <td class="num" data-label="Distance">${Math.round(cg.miles)} mi ${esc(cg.heading)}</td>
      <td data-label="${open.length} open"><div class="sites">${chips}</div></td>
      <td class="num" data-label="Per night">${esc(price)}</td>
      <td><a class="book" href="${esc(book)}" target="_blank" rel="noopener">Book</a></td>
    </tr>`;
  }).join("");
  $("results").innerHTML = `<table><thead><tr><th>Campground</th><th>Distance</th><th>Open sites</th>
    <th>Per night</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => { data = d; setup(); })
  .catch(() => { $("sub").textContent = "Couldn't load the latest results. The first update may not have run yet."; });
</script>
</body>
</html>
